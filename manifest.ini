name = warframeAccessibility
summary = "Warframe Accessibility"
version = 1.0.0
description = """Melhora a acessibilidade integral do Launcher e do Warframe para usuários do NVDA sem esconder ou remover nenhum elemento (Design Universal / WCAG).
Recursos:
- Navegação completa por todos os controles (botões, barra de download e vitrine Web com notícias e notas de versão).
- Resiliência total a Alt+Tab: o foco e o leitor permanecem perfeitamente vinculados à interface.
- Tab / Shift+Tab: Percorre sequencialmente todos os botões nativos, status de download e vitrine Web.
- Alt+W: Entra imediatamente no documento Web para ler novidades e notas de atualização com setas para cima/baixo.
- Alt+S / Control+Shift+S / NVDA+Shift+S: Anuncia velocidade, porcentagem e tempo restante de download.
- Alt+J / Control+Shift+J / NVDA+Shift+J: Inicia o jogo ou informa status do download.
- Alt+C: Abre as configurações do Launcher.
- F1: Guia falado com todos os atalhos.
"""
author = "Jhonata <jhonata@acessibilidade.dev>"
url = https://github.com/jhonata192/warframeAccessibility
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
